# Configuration for the Linux CI/testbed machine used during development.
# On Linux, ECO = nice(10), which does NOT lower CPU frequency, so the power
# model must not credit ECO with lower per-core power. (On Windows, EcoQoS does
# lower frequency; run `greenthread calibrate` there instead of using this file.)
[carbon]
source = "csv"
csv_path = "data/traces/de_2020_hourly.csv"
csv_start = "2020-07-07T05:00:00"
seconds_per_trace_hour = 10.0

[energy]
per_core_w_normal = 4.5
per_core_w_eco = 4.5

[scheduler]
defer_step_s = 2.0
safety_margin_s = 2.0
max_concurrent = 1
tick_s = 0.2
