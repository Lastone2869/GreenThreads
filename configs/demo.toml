# Compressed-time demo: 1 hour of the recorded grid trace = 10 s of wall time,
# so a ~4-minute run spans a full day of carbon-intensity variation.
# Trace: Germany 2020-07-07 (real ENTSO-E data via the Let's Wait Awhile dataset).
[carbon]
source = "csv"
csv_path = "data/traces/de_2020_hourly.csv"
csv_start = "2020-07-07T05:00:00"
seconds_per_trace_hour = 10.0
freshness_half_life_s = 3600.0
forecast_half_life_h = 12.0

[scheduler]
defer_step_s = 2.0
safety_margin_s = 2.0
max_concurrent = 1
tick_s = 0.2
