[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greenthread"
version = "1.0.0"
description = "Carbon- and battery-aware multicore job scheduler for Windows 11 (R-BACI)"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scikit-learn>=1.3", "scipy>=1.11", "psutil>=5.9", "matplotlib>=3.8"]

[project.scripts]
greenthread = "greenthread.cli:main"

[tool.setuptools]
packages = ["greenthread", "greenthread.backends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
